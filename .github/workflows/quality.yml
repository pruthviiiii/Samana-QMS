name: QMS quality
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run --project server tests/domain.test.ts tests/apex-only.test.ts tests/scheduler.test.ts tests/events.test.ts tests/routes.test.ts tests/openapi.test.ts tests/config.test.ts tests/proxy.test.ts
      - run: npx vitest run --project browser
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run build:worker
  database-tests:
    # The full suite runs against a PostgreSQL 18 container started inside the
    # workflow, so every pull request and push is tested on a fresh database
    # with no external service and no secret.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: samana_qms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrate and test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/samana_qms_test
          APP_ORIGIN: http://qms.test
          SESSION_COOKIE_SECURE: "false"
          QR_SIGNING_SECRET: ci-synthetic-key-not-used-outside-tests
          WORKER_SECRET: ci-synthetic-worker-key
        run: |
          node scripts/migrate.mjs
          npm run test:coverage
