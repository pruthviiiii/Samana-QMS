name: QMS quality
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run tests/domain.test.ts tests/apex-only.test.ts tests/scheduler.test.ts
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run build:node
      - run: npm run build:worker
  database-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: qms-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrate and test isolated database
        env:
          DATABASE_URL: ${{ secrets.QMS_TEST_DATABASE_URL }}
          APP_ORIGIN: http://qms.test
          SESSION_COOKIE_SECURE: "false"
          QR_SIGNING_SECRET: ci-synthetic-key-not-used-outside-tests
          WORKER_SECRET: ci-synthetic-worker-key
        run: |
          test -n "$DATABASE_URL"
          node scripts/migrate.mjs
          npm test
