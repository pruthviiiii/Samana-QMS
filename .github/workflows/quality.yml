name: QMS quality
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run --project server tests/domain.test.ts tests/apex-only.test.ts tests/events.test.ts tests/routes.test.ts tests/openapi.test.ts tests/config.test.ts tests/proxy.test.ts
      - run: npx vitest run --project browser
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run build:worker
      - run: npm run build:api
  images:
    # Render builds these services natively, so nothing here gates the
    # production deployment. This job exists because the Dockerfile and
    # compose.yaml are the path for any other host, and a build context is the
    # kind of thing that breaks silently: .dockerignore is an allow-list, so a
    # directory that moves stops being copied and the failure only appears at
    # run time, in an image that looks like it built cleanly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the three images
        run: |
          docker build --target web    -t qms-web    .
          docker build --target api    -t qms-api    .
          docker build --target worker -t qms-worker .
      - name: Check each image carries what its CMD runs
        # Not a health check -- there is no database here. It asserts the file
        # each image's CMD names is actually inside it. The web image flattens
        # the standalone tree into /app, so its entry is frontend/server.js,
        # not the dist-node path used outside the image; its static assets are
        # checked too, because scripts/build.mjs places those separately and a
        # server without them starts and then serves an unstyled page.
        run: |
          set -e
          docker run --rm --entrypoint test qms-web    -f frontend/server.js
          docker run --rm --entrypoint test qms-web    -d frontend/.next/static
          docker run --rm --entrypoint test qms-api    -f dist-api/api.mjs
          docker run --rm --entrypoint test qms-api    -f scripts/migrate.mjs
          docker run --rm --entrypoint test qms-worker -f dist-worker/worker.mjs
          echo "All three images carry their entry points."

  database-tests:
    # The full suite runs against a PostgreSQL 18 container started inside the
    # workflow, so every pull request and push is tested on a fresh database
    # with no external service and no secret.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: samana_qms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrate and test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/samana_qms_test
          APP_ORIGIN: http://qms.test
          SESSION_COOKIE_SECURE: "false"
          QR_SIGNING_SECRET: ci-synthetic-key-not-used-outside-tests
          WORKER_SECRET: ci-synthetic-worker-key
        run: |
          node scripts/migrate.mjs
          npm run test:coverage
