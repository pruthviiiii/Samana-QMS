# Render Blueprint for Samana QMS: three services.
#   samana-qms            web tier (standalone Node build of the Next.js app).
#                         Serves the screens and forwards /api to the API
#                         service over Render's private network. Holds no
#                         database or integration credential.
#   samana-qms-api        API service. Hosts the route table, the Prisma client
#                         and the database pool; runs migrations before it
#                         starts. It is a web service so that it works on every
#                         workspace plan, but it accepts only requests that
#                         carry API_PROXY_TOKEN, which the web tier adds to
#                         everything it forwards, so its public address is
#                         usable by nobody else. On a workspace that allows
#                         private services, change its type to pserv and the
#                         two fromService references below to type: pserv.
#   samana-qms-scheduler  background worker: routing tick, outbox delivery and
#                         retention, directly against the database.
# Spec: https://render.com/docs/blueprint-spec
#
# Secrets (sync: false) are entered once, on the API service, and never live in
# git. The scheduler copies its database and integration settings from the API
# service; the web tier receives only the API's private address and the token.
# DATABASE_URL is the restricted qms_app role (scripts/create-app-role.mjs);
# MIGRATE_DATABASE_URL is the owner string the pre-deploy migration runs with.
# A Blueprint sync never deletes variables removed from this file: after the
# first sync of this layout, remove the old database and Salesforce values
# from the web service by hand.

services:
  - type: web
    name: samana-qms
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: npm ci --include=dev && npm run build:node
    startCommand: node dist-node/standalone/frontend/server.js
    # Health goes through the proxy to the API, so it proves the whole chain.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        value: https://samana-qms.onrender.com
      # The API's private host:port on Render's network; the web tier adds http://.
      - key: API_URL
        fromService:
          type: web
          name: samana-qms-api
          property: hostport
      - key: API_PROXY_TOKEN
        fromService:
          type: web
          name: samana-qms-api
          envVarKey: API_PROXY_TOKEN

  - type: web
    name: samana-qms-api
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: npm ci --include=dev && npm run build:api
    preDeployCommand: node scripts/migrate.mjs
    startCommand: node dist-api/api.mjs
    # Readiness is the one path the API answers without the token.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render assigns PORT; the service listens on it.
      - key: APP_ORIGIN
        value: https://samana-qms.onrender.com
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: API_PROXY_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MIGRATE_DATABASE_URL
        sync: false
      - key: SALESFORCE_INSTANCE_URL
        sync: false
      - key: SALESFORCE_CLIENT_ID
        sync: false
      - key: SALESFORCE_CLIENT_SECRET
        sync: false
      - key: SALESFORCE_API_VERSION
        value: "67.0"
      - key: SALESFORCE_WRITE_ENABLED
        value: "true"
      # Kept for hosts that drive the tick through POST /api/jobs/run instead
      # of running the worker directly; the Render worker does not use it.
      - key: WORKER_SECRET
        generateValue: true
      - key: QR_SIGNING_SECRET
        generateValue: true
      # The web tier forwards the address Render's edge appended as
      # x-client-address; the API keys per-address limits on it.
      - key: TRUSTED_CLIENT_IP_HEADER
        value: x-client-address
      # Retention stays off (empty) until a period is agreed; see docs/operations.md.
      - key: RETENTION_IDENTIFIER_DAYS
        value: ""
      - key: RETENTION_EVENT_DAYS
        value: ""
      - key: SMS_ENABLED
        value: "false"
      - key: SMS_SENDER
        value: SAMANA

  - type: worker
    name: samana-qms-scheduler
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    # Direct database mode: no HTTP hop and no shared secret between services.
    buildCommand: npm ci --include=dev && npm run build:worker
    startCommand: node dist-worker/worker.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        value: https://samana-qms.onrender.com
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromService:
          type: web
          name: samana-qms-api
          envVarKey: DATABASE_URL
      - key: SALESFORCE_INSTANCE_URL
        fromService:
          type: web
          name: samana-qms-api
          envVarKey: SALESFORCE_INSTANCE_URL
      - key: SALESFORCE_CLIENT_ID
        fromService:
          type: web
          name: samana-qms-api
          envVarKey: SALESFORCE_CLIENT_ID
      - key: SALESFORCE_CLIENT_SECRET
        fromService:
          type: web
          name: samana-qms-api
          envVarKey: SALESFORCE_CLIENT_SECRET
      - key: SALESFORCE_API_VERSION
        fromService:
          type: web
          name: samana-qms-api
          envVarKey: SALESFORCE_API_VERSION
      - key: SALESFORCE_WRITE_ENABLED
        fromService:
          type: web
          name: samana-qms-api
          envVarKey: SALESFORCE_WRITE_ENABLED
      - key: SMS_ENABLED
        fromService:
          type: web
          name: samana-qms-api
          envVarKey: SMS_ENABLED
      - key: SMS_SENDER
        fromService:
          type: web
          name: samana-qms-api
          envVarKey: SMS_SENDER
      # Not fromService: Render's sync engine evaluates a fromService.envVarKey
      # reference at the same time it creates the source variable, and an
      # empty-string value on the source is not resolved in time, so a
      # variable declared this way (unlike a real value or a sync: false
      # secret) fails the sync with "used but not defined". Declared directly
      # here instead, with the same empty default the API service uses (above).
      # When a retention period is agreed, set both copies.
      - key: RETENTION_IDENTIFIER_DAYS
        value: ""
      - key: RETENTION_EVENT_DAYS
        value: ""
