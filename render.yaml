# Render Blueprint for Samana QMS.
#   samana-qms            web app (standalone Node build of the Next.js app)
#   samana-qms-scheduler  background worker: routing tick, outbox delivery and
#                         retention every 15 s, directly against the database
# Spec: https://render.com/docs/blueprint-spec
#
# Secrets (sync: false) are entered once in the Render dashboard and never live in git.
# The scheduler copies the database URL and the Salesforce, SMS and retention
# settings from the web service, so both run the same integration configuration.
# DATABASE_URL is the restricted qms_app role (scripts/create-app-role.mjs);
# MIGRATE_DATABASE_URL is the owner string the pre-deploy migration runs with.

services:
  - type: web
    name: samana-qms
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: npm ci --include=dev && npm run build:node
    preDeployCommand: node scripts/migrate.mjs
    startCommand: node dist-node/standalone/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        value: https://samana-qms.onrender.com
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: MIGRATE_DATABASE_URL
        sync: false
      - key: SALESFORCE_INSTANCE_URL
        sync: false
      - key: SALESFORCE_CLIENT_ID
        sync: false
      - key: SALESFORCE_CLIENT_SECRET
        sync: false
      - key: SALESFORCE_API_VERSION
        value: "67.0"
      - key: SALESFORCE_WRITE_ENABLED
        value: "true"
      # Kept for hosts that drive the tick through POST /api/jobs/run instead
      # of running the worker directly; the Render worker does not use it.
      - key: WORKER_SECRET
        generateValue: true
      - key: QR_SIGNING_SECRET
        generateValue: true
      # Render's proxy appends the client address to x-forwarded-for; the app
      # keys per-address limits on that last entry.
      - key: TRUSTED_CLIENT_IP_HEADER
        value: x-forwarded-for
      # Retention stays off (empty) until a period is agreed; see docs/operations.md.
      - key: RETENTION_IDENTIFIER_DAYS
        value: ""
      - key: RETENTION_EVENT_DAYS
        value: ""
      - key: SMS_ENABLED
        value: "false"
      - key: SMS_SENDER
        value: SAMANA

  - type: worker
    name: samana-qms-scheduler
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    # Direct database mode: no HTTP hop and no shared secret between the two
    # services. The worker needs the same integration settings as the web app.
    buildCommand: npm ci --include=dev && npm run build:worker
    startCommand: node dist-worker/worker.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          type: web
          name: samana-qms
          envVarKey: DATABASE_URL
      - key: SALESFORCE_INSTANCE_URL
        fromService:
          type: web
          name: samana-qms
          envVarKey: SALESFORCE_INSTANCE_URL
      - key: SALESFORCE_CLIENT_ID
        fromService:
          type: web
          name: samana-qms
          envVarKey: SALESFORCE_CLIENT_ID
      - key: SALESFORCE_CLIENT_SECRET
        fromService:
          type: web
          name: samana-qms
          envVarKey: SALESFORCE_CLIENT_SECRET
      - key: SALESFORCE_API_VERSION
        fromService:
          type: web
          name: samana-qms
          envVarKey: SALESFORCE_API_VERSION
      - key: SALESFORCE_WRITE_ENABLED
        fromService:
          type: web
          name: samana-qms
          envVarKey: SALESFORCE_WRITE_ENABLED
      - key: SMS_ENABLED
        fromService:
          type: web
          name: samana-qms
          envVarKey: SMS_ENABLED
      - key: SMS_SENDER
        fromService:
          type: web
          name: samana-qms
          envVarKey: SMS_SENDER
      - key: RETENTION_IDENTIFIER_DAYS
        fromService:
          type: web
          name: samana-qms
          envVarKey: RETENTION_IDENTIFIER_DAYS
      - key: RETENTION_EVENT_DAYS
        fromService:
          type: web
          name: samana-qms
          envVarKey: RETENTION_EVENT_DAYS
