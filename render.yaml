# Render Blueprint for Samana QMS.
#   samana-qms            web app (standalone Node build of the Next.js app)
#   samana-qms-scheduler  background worker that ticks routing and outbox delivery every 15 s
# Spec: https://render.com/docs/blueprint-spec
#
# Secrets (sync: false) are entered once in the Render dashboard and never live in git.
# The scheduler copies the shared secret and database URL from the web service.
# DATABASE_URL is the restricted qms_app role (scripts/create-app-role.mjs);
# MIGRATE_DATABASE_URL is the owner string the pre-deploy migration runs with.

services:
  - type: web
    name: samana-qms
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: npm ci --include=dev && npm run build:node
    preDeployCommand: node scripts/migrate.mjs
    startCommand: node dist-node/standalone/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        value: https://samana-qms.onrender.com
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: MIGRATE_DATABASE_URL
        sync: false
      - key: SALESFORCE_INSTANCE_URL
        sync: false
      - key: SALESFORCE_CLIENT_ID
        sync: false
      - key: SALESFORCE_CLIENT_SECRET
        sync: false
      - key: SALESFORCE_API_VERSION
        value: "67.0"
      - key: SALESFORCE_WRITE_ENABLED
        value: "true"
      - key: WORKER_SECRET
        generateValue: true
      - key: QR_SIGNING_SECRET
        generateValue: true
      # Render's proxy appends the client address to x-forwarded-for; the app
      # keys per-address limits on that last entry.
      - key: TRUSTED_CLIENT_IP_HEADER
        value: x-forwarded-for
      # Retention stays off (empty) until a period is agreed; see docs/operations.md.
      - key: RETENTION_IDENTIFIER_DAYS
        value: ""
      - key: RETENTION_EVENT_DAYS
        value: ""
      - key: SMS_ENABLED
        value: "false"
      - key: SMS_SENDER
        value: SAMANA

  - type: worker
    name: samana-qms-scheduler
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: node scripts/worker.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: WORKER_ORIGIN
        value: https://samana-qms.onrender.com
      - key: WORKER_SECRET
        fromService:
          type: web
          name: samana-qms
          envVarKey: WORKER_SECRET
      - key: DATABASE_URL
        fromService:
          type: web
          name: samana-qms
          envVarKey: DATABASE_URL
